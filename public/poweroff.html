<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#050505" />
    <title>POWER OFF</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; background: #050505; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        color: #b8b8b8;
        font-family: "Courier New", ui-monospace, monospace;
        text-align: center;
      }
      main { opacity: 0.72; }
      h1 { margin: 0 0 18px; font-size: clamp(20px, 5vw, 32px); letter-spacing: 0.2em; }
      p { margin: 0; font-size: 14px; line-height: 1.8; }
    </style>
  </head>
  <body>
    <main>
      <h1>POWER OFF</h1>
      <p>ブラウザの戻る操作で復帰できます。</p>
    </main>
  </body>
</html>
